name: Build check

on:
    pull_request:
    workflow_dispatch:

concurrency:
    group: build-check-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    build-check:
        name: build-check
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Verify current upstream is included
              run: |
                  git fetch --no-tags https://github.com/concrnt/world-app.git +refs/heads/main:refs/remotes/upstream/main
                  if ! git merge-base --is-ancestor refs/remotes/upstream/main HEAD; then
                    echo "PR head is missing the current concrnt/world-app main." >&2
                    exit 1
                  fi

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10.33.0
                  run_install: false

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22.12.0
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Test deployment and upstream-sync guards
              run: |
                  bash -n ops/vps-deployer/deploy.sh ops/vps-deployer/deploy-lib.sh ops/vps-deployer/test-deploy.sh
                  ops/vps-deployer/test-deploy.sh
                  scripts/test-prepare-upstream-sync.sh

            - name: Check fork contract anchors
              run: scripts/check-fork-contract.sh

            - name: Test legacy client fallback
              run: pnpm --filter @concrnt/client test

            - name: Test fork world behavior
              run: pnpm --filter @concrnt/worldlib test:fork

            - name: Test legacy WebKit popover placement
              run: pnpm --filter @concrnt/ui test:popover

            - name: Test web fork state transitions
              run: pnpm --filter web test:fork

            - name: Build web deployment
              run: pnpm --workspace-concurrency=1 --filter web... build

            - name: Build desktop app
              run: pnpm --workspace-concurrency=1 --filter world-app... build
